apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: sparks
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels: 
        app: frontend
    spec:
      containers:                                                                                                                                                 
      - name: frontend
        image: nginx:alpine                                                                                                                                       
        ports:  
        - containerPort: 80
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "64Mi"
            cpu: "100m"

---
apiVersion: v1
kind: Service
metadata: 
  name: frontend
  namespace: sparks
spec: 
  selector: 
    app: frontend
  ports:
  - port: 80
    targetPort: 80