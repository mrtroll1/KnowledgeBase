apiVersion: apps/v1
kind: Deployment
metadata:
  name: matcher-service
  namespace: sparks
spec:
  replicas: 1
  selector:
    matchLabels:
      app: matcher-service
  template:
    metadata:
      labels: 
        app: matcher-service
    spec:
      containers:                                                                                                                                                 
      - name: matcher
        image: nginx:alpine                                                                                                                                       
        ports:  
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: db-credentials
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "64Mi"
            cpu: "100m"

---
apiVersion: v1
kind: Service
metadata: 
  name: matcher-service
  namespace: sparks
spec: 
  selector: 
    app: matcher-service
  ports:
  - port: 80
    targetPort: 80