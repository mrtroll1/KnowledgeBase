# ============================================================
# Sparks Helm values — v2 (Lesson 5: Health & Scaling)
# Copied from Lesson 4, will be evolved interactively.
# ============================================================

namespace: sparks

# --- Database ---
postgres:
  image: postgres:16
  storage: 1Gi
  credentials:
    user: sparks_admin
    password: sup3rs3cret
    database: sparks_db
  resources:
    requests:
      memory: "128Mi"
      cpu: "250m"
    limits:
      memory: "256Mi"
      cpu: "500m"

# --- Cache ---
redis:
  image: redis:7-alpine
  resources:
    requests:
      memory: "64Mi"
      cpu: "100m"
    limits:
      memory: "128Mi"
      cpu: "250m"

# --- Application Services ---
profilesService:
  image: nginx:alpine
  replicas: 2
  resources:
    requests:
      memory: "32Mi"
      cpu: "50m"
    limits:
      memory: "64Mi"
      cpu: "100m"

matcherService:
  image: nginx:alpine
  replicas: 1
  resources:
    requests:
      memory: "32Mi"
      cpu: "50m"
    limits:
      memory: "64Mi"
      cpu: "100m"

apiGateway:
  image: nginx:alpine
  replicas: 2                  # used as fallback when autoscaling is off
  autoscaling:
    enabled: true
    minReplicas: 1             # scale down to 1 when idle
    maxReplicas: 5             # cap at 5 under heavy load
    targetCPUPercent: 50       # scale up when avg CPU > 50% of requests
  resources:
    requests:
      memory: "32Mi"
      cpu: "50m"               # ← HPA uses THIS as the 100% baseline
    limits:
      memory: "64Mi"
      cpu: "100m"

frontend:
  image: nginx:alpine
  replicas: 2
  resources:
    requests:
      memory: "32Mi"
      cpu: "50m"
    limits:
      memory: "64Mi"
      cpu: "100m"

# --- Ingress ---
ingress:
  host: sparks.local
