apiVersion: apps/v1
kind: Deployment
metadata:
  name: matcher-service
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.matcherService.replicas }}
  selector:
    matchLabels:
      app: matcher-service
  template:
    metadata:
      labels:
        app: matcher-service
    spec:
      containers:
      - name: matcher
        image: {{ .Values.matcherService.image }}
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: db-credentials
        volumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d/
        livenessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 2
          periodSeconds: 5
          failureThreshold: 2
        resources:
          {{- toYaml .Values.matcherService.resources | nindent 10 }}
      volumes:
      - name: nginx-conf
        configMap:
          name: nginx-configs
          items:
          - key: matcher-service.conf
            path: default.conf

---
apiVersion: v1
kind: Service
metadata:
  name: matcher-service
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: matcher-service
  ports:
  - port: 80
    targetPort: 80
