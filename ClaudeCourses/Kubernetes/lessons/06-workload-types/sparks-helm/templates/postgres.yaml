apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: {{ .Values.namespace }}
spec:
  clusterIP: None                # <-- Headless: no virtual IP, direct pod DNS
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: {{ .Values.namespace }}
spec:
  serviceName: postgres-headless   # Links to the headless service above
  replicas: {{ .Values.postgres.replicas }}
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: {{ .Values.postgres.image }}
        ports:
        - containerPort: 5432
        envFrom:
        - secretRef:
            name: db-credentials
        startupProbe:
          tcpSocket:
            port: 5432
          periodSeconds: 5
          failureThreshold: 30       # 5s x 30 = up to 150s to start
        livenessProbe:
          tcpSocket:
            port: 5432
          periodSeconds: 20
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 5432
          periodSeconds: 10
          failureThreshold: 2
        volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data
          subPath: pgdata
        resources:
          {{- toYaml .Values.postgres.resources | nindent 10 }}
  # --- volumeClaimTemplates (replaces the old standalone PVC) ---
  # Each pod gets its own PVC automatically:
  #   postgres-0 → pgdata-postgres-0
  #   postgres-1 → pgdata-postgres-1
  # No more manual PVC wiring!
  volumeClaimTemplates:
  - metadata:
      name: pgdata
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: {{ .Values.postgres.storage }}
