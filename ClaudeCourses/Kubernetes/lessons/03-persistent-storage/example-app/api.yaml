apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: my-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: my-api:1.0
        ports:
        - containerPort: 3000
        env:
        # Connection string uses the postgres Service DNS name.
        # Same namespace, so just "postgres" works.
        - name: DATABASE_URL
          value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
        envFrom:
        - secretRef:
            name: postgres-credentials

---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: my-app
spec:
  selector:
    app: api
  ports:
  - port: 80
    targetPort: 3000
