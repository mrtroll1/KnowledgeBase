apiVersion: v1
kind: PersistentVolumeClaim
metadata: 
  name: postgres-pvc
  namespace: sparks
spec:
  accessModes: 
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # minikube has a default StorageClass called "standard"
  # that auto-provisions hostPath PVs — no manual PV needed!
  
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: sparks
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16
        ports: 
        - containerPort: 5432
        envFrom:
        - secretRef:
            name: db-credentials
        volumeMounts:
        - name: pg-data
          mountPath: /var/lib/postgresql/data
          subPath: pgdata
        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "256Mi"
            cpu: "500m"
      volumes:
      - name: pg-data
        persistentVolumeClaim:
          claimName: postgres-pvc

---
apiVersion: v1
kind: Service 
metadata: 
  name: postgres
  namespace: sparks
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432